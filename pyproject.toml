[project]
name = "datasus-extractor"
version = "2.0.0"
description = "Coleta de qualquer tabulação do TabNet/DATASUS (SIH, SIM, SINASC e SIA) em planilha, com evidências e conferência independente"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
