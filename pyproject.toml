[project]
name = "datasus-extractor"
version = "1.0.0"
description = "Coleta automatizada de internações do SIH/SUS no TabNet/DATASUS, com evidências e conferência independente"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
