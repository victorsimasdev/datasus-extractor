name: Regressão

# Testes contra o site de verdade do TabNet (os testes de unidade usam páginas salvas):
# - coleta: um pedido pequeno por base (SIH, SIM, SINASC, SIA), em períodos antigos e fechados,
#   comparado célula a célula com o resultado conferido em tests/regressao/esperado;
# - formulários: os 112 formulários do site comparados com as opções que o programa conhece;
# - executável: gera o ExtratorDATASUS.exe e roda uma coleta com ele.
# Roda toda segunda-feira, à mão pela aba Actions e nos PRs que mexem na coleta ou no executável.
# Se o DATASUS revisar algum dado antigo de propósito: python ferramentas/regressao.py --gravar

on:
  schedule:
    - cron: "0 9 * * 1"  # segunda, 6h em Brasília
  workflow_dispatch:
  pull_request:
    paths:
      - "extrator/**"
      - "empacotamento/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "tests/regressao/**"
      - "ferramentas/regressao.py"
      - ".github/workflows/regressao.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: regressao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coleta:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar e comparar com o esperado
        run: python ferramentas/regressao.py

  formularios:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Conferir os 112 formulários do site
        run: python ferramentas/verificar_formularios.py

  executavel:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Gerar o executável
        run: |
          pip install -r requirements-build.txt
          python empacotamento/gerar_exe.py --saida dist
      - name: Coletar com o executável e comparar
        run: python ferramentas/regressao.py --exe dist/ExtratorDATASUS.exe --so sinasc,sih
